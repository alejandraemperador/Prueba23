name: print-lab-preparcial

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: print_lab
      POSTGRES_USER: print_lab
      POSTGRES_PASSWORD: print_lab_local
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U print_lab -d print_lab"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
